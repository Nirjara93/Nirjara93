<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Successfully Logged In</title>
    <style>
        /* General Styling */
        body {
            background-color: rgb(53, 56, 58);
            color: rgb(170, 9, 103);
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 0;
        }

        /* Heading */
        h1 {
            background-color: rgb(53, 56, 58);
            color: rgb(187, 38, 113);
            font-family: Verdana, sans-serif;
            font-size: 250%;
            padding: 20px;
            border-radius: 10px;
            display: inline-block;
        }

        /* Movie Message */
        p {
            color: red;
            font-family: Courier, monospace;
            font-size: 160%;
        }

        /* Movie Icon */
        .movie-icon {
            font-size: 100px;
            animation: bounce 1.5s infinite alternate;
        }

        @keyframes bounce {
            from { transform: translateY(0); }
            to { transform: translateY(-10px); }
        }

        /* Buttons */
        .btn {
            background-color: red;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 18px;
            cursor: pointer;
            border-radius: 5px;
            margin-top: 20px;
            transition: background-color 0.3s;
        }

        .btn:hover {
            background-color: darkred;
        }
    </style>
</head>
<body>

    <!-- Success Message -->
    <h1>Successfully Logged In</h1>

    <!-- Movie Icon -->
    <div class="movie-icon">🎬</div>

    <!-- Enjoy Message -->
    <p>Enjoy Your Movie Time</p>

</body>
</html>
